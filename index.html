<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Куда поехать отдыхать</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: two full-screen slides (greeting -> three flip cards), switched with a horizontal slide. */
:root{
  /* Palette: Soft Blush FFDBDA, Old Rose DB7F8E, Pale Slate D5C5C8, Cool Steel 9DA3A4, Taupe Grey 604D53 */
  --bg:#FFDBDA;
  --fg:#604D53;
  --muted:#6f5b61;
  --accent:#DB7F8E;
  --accent-fg:#3a2a2f;
  --card-back:#604D53;   /* card face-down */
  --card-back-line:#765f67;
  --card-front:#D5C5C8;
  --line:#9DA3A4;
  --font-display:'Unbounded','Arial Black',sans-serif;
  --font-body:'Manrope','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2c2124;--fg:#FFDBDA;--muted:#D5C5C8;--accent:#DB7F8E;--accent-fg:#2c2124;
    --card-back:#604D53;--card-back-line:#78626a;--card-front:#3d3135;--line:#604D53;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2c2124;--fg:#FFDBDA;--muted:#D5C5C8;--accent:#DB7F8E;--accent-fg:#2c2124;
  --card-back:#604D53;--card-back-line:#78626a;--card-front:#3d3135;--line:#604D53;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow-x:hidden;
}
.deck{height:100%;position:relative}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2rem;text-align:center;padding-block:24px;
  transition:transform .7s cubic-bezier(.7,0,.2,1),opacity .5s;
}
#s1{transform:translateX(0)}
#s2{transform:translateX(110%);opacity:0;pointer-events:none}
.deck.on-2 #s1{transform:translateX(-110%);opacity:0;pointer-events:none}
.deck.on-2 #s2{transform:translateX(0);opacity:1;pointer-events:auto}
#s3{transform:translateX(110%);opacity:0;pointer-events:none}
.deck.on-3 #s2{transform:translateX(-110%);opacity:0;pointer-events:none}
.deck.on-3 #s3{transform:translateX(0);opacity:1;pointer-events:auto}

.eyebrow{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1,h2{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(2rem,6vw,4rem);max-width:16ch}
h2{font-size:clamp(1.4rem,3.6vw,2.2rem);max-width:20ch}
.lead{max-width:46ch;color:var(--muted);font-size:1.1rem;margin:0}
.lead b{color:var(--fg)}
.btn{
  font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;
  padding:.9rem 2rem;cursor:pointer;transition:transform .2s;
}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,.card:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.back{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:.5rem}


.cards{display:grid;grid-template-columns:repeat(3,minmax(0,260px));gap:1.5rem;justify-content:center;width:100%}
.card{
  perspective:1000px;background:none;border:0;padding:0;cursor:pointer;aspect-ratio:3/4;width:100%;
  font:inherit;color:inherit;
}
.inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  display:flex;flex-direction:column;
}
.face.back-face{
  background:var(--card-back);
  background-image:
    repeating-linear-gradient(45deg,transparent 0 14px,var(--card-back-line) 14px 15px),
    repeating-linear-gradient(-45deg,transparent 0 14px,var(--card-back-line) 14px 15px);
  align-items:center;justify-content:center;
}
.face.back-face::after{
  content:"";position:absolute;inset:12px;border:1.5px solid var(--accent);border-radius:12px;opacity:.9;
}
.mark{
  position:relative;z-index:1;width:74px;height:74px;border-radius:50%;background:var(--card-back);
  display:grid;place-items:center;border:1.5px solid var(--accent);
  font-family:var(--font-display);font-size:1.8rem;color:var(--accent);
}
.face.front-face{background:var(--card-front);transform:rotateY(180deg);border:1px solid var(--line);text-align:left}
.photo{flex:1;min-height:0;background-size:cover;background-position:center;position:relative}
.photo.ph{display:grid;place-items:center;color:#FFDBDA;font-family:var(--font-display);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.ph1{background:linear-gradient(160deg,#DB7F8E,#604D53)}
.ph2{background:linear-gradient(160deg,#9DA3A4,#604D53)}
.ph3{background:linear-gradient(200deg,#DB7F8E,#9DA3A4)}
.name{font-family:var(--font-display);font-weight:500;font-size:1.05rem;padding:1rem 1.1rem 1.15rem;text-wrap:balance}

.slide>*:not(canvas){position:relative;z-index:1}
.cat{width:clamp(110px,20vh,170px);height:auto;display:block;overflow:visible}
.cat .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite alternate}
.cat .tail{transform-box:view-box;transform-origin:172px 232px;animation:sway 2.6s ease-in-out infinite alternate}
.cat .head{transform-box:view-box;transform-origin:120px 130px;animation:nod 1s ease-in-out infinite alternate}
.cat .arm{transform-box:view-box;transform-origin:148px 150px;animation:wash 1s ease-in-out infinite alternate}
.cat .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes breathe{to{transform:scaleY(1.018)}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes nod{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
@keyframes wash{from{transform:rotate(-13deg)}to{transform:rotate(11deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.pick{width:min(280px,100%);aspect-ratio:3/4;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;background:var(--card-front);border:1px solid var(--line);text-align:left;box-shadow:0 18px 40px rgba(44,33,36,.22)}
.deck.on-3 .pick{animation:pop .8s .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.pick-info{margin:0;max-width:46ch;line-height:1.7}
.pick-info a{color:var(--fg);font-weight:700;text-underline-offset:3px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:.75rem}
.btn-ghost{background:none;color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(44,33,36,.5);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .4s}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:80%;overflow-y:auto;
  background:var(--card-front);color:var(--fg);border-radius:24px 24px 0 0;
  padding:1rem max(16px,env(safe-area-inset-right,0px)) calc(1.75rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(100%);visibility:hidden;transition:transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .55s;
  box-shadow:0 -12px 40px rgba(44,33,36,.25);
}
.sheet.open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:1rem;align-items:flex-start;text-align:left}
.grab{width:48px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{font-family:var(--font-display);font-weight:700;font-size:clamp(1.3rem,3.5vw,1.8rem);line-height:1.15;margin:.5rem 0 0;text-wrap:balance}
.sheet a{color:var(--fg);font-weight:700;text-underline-offset:3px}
.sheet a:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.sheet p{margin:0;max-width:62ch;font-size:1.05rem}
.sheet .btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
@media (max-width:760px){
  body{overflow-y:auto}
  .deck{height:auto;min-height:100%}
  .slide{position:absolute;min-height:100%;height:auto;justify-content:flex-start;padding-block:32px}
  #s1{justify-content:center}
  .cards{grid-template-columns:minmax(0,230px);gap:1.1rem}
}
@media (prefers-reduced-motion:reduce){
  .slide,.inner,.btn,.sheet,.scrim{transition:none}
  .deck.on-3 .pick{animation:none}
  #fx{display:none}
  .cat *{animation:none!important}
}
</style>

</head>
<body>
<main class="deck" id="deck">
  <section class="slide" id="s1" aria-label="Приветствие">
    <svg class="cat" viewBox="0 0 240 262" role="img" aria-label="Кошка сидит и умывается лапкой">
      <ellipse cx="120" cy="256" rx="78" ry="6" fill="#604D53" opacity=".18"/>
      <g class="tail">
        <path d="M172 236 C232 238 240 184 208 166" fill="none" stroke="#604D53" stroke-width="22" stroke-linecap="round"/>
        <path d="M172 236 C232 238 240 184 208 166" fill="none" stroke="#9DA3A4" stroke-width="16" stroke-linecap="round"/>
      </g>
      <g class="body">
        <path d="M120 108 C70 114 54 190 62 236 C64 252 90 254 120 254 C150 254 176 252 178 236 C186 190 170 114 120 108Z" fill="#9DA3A4" stroke="#604D53" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="120" cy="196" rx="30" ry="46" fill="#D5C5C8"/>
        <path d="M99 170 L96 238" fill="none" stroke="#604D53" stroke-width="25" stroke-linecap="round"/>
        <path d="M99 170 L96 238" fill="none" stroke="#9DA3A4" stroke-width="19" stroke-linecap="round"/>
        <ellipse cx="96" cy="244" rx="15" ry="9" fill="#D5C5C8" stroke="#604D53" stroke-width="3"/>
        <ellipse cx="150" cy="246" rx="20" ry="9" fill="#9DA3A4" stroke="#604D53" stroke-width="3"/>
      </g>
      <g class="head">
        <path d="M80 70 L74 26 L110 52Z" fill="#9DA3A4" stroke="#604D53" stroke-width="3" stroke-linejoin="round"/>
        <path d="M160 70 L166 26 L130 52Z" fill="#9DA3A4" stroke="#604D53" stroke-width="3" stroke-linejoin="round"/>
        <path d="M84 58 L81 38 L100 52Z" fill="#DB7F8E"/>
        <path d="M156 58 L159 38 L140 52Z" fill="#DB7F8E"/>
        <ellipse cx="120" cy="88" rx="47" ry="41" fill="#9DA3A4" stroke="#604D53" stroke-width="3"/>
        <ellipse cx="120" cy="103" rx="21" ry="14" fill="#D5C5C8"/>
        <path d="M113 94 L127 94 L120 102Z" fill="#DB7F8E"/>
        <path d="M120 102 L120 107 M120 107 Q113 113 108 109 M120 107 Q127 113 132 109" fill="none" stroke="#604D53" stroke-width="2" stroke-linecap="round"/>
        <g class="eyes" fill="#3a2a2f">
          <ellipse cx="101" cy="82" rx="5" ry="7"/>
          <ellipse cx="139" cy="82" rx="5" ry="7"/>
        </g>
        <g stroke="#604D53" stroke-width="1.5" stroke-linecap="round" opacity=".6">
          <path d="M96 100 L66 94 M96 105 L66 108"/>
          <path d="M144 100 L174 94 M144 105 L174 108"/>
        </g>
      </g>
      <g class="arm">
        <path d="M148 152 Q160 122 135 105" fill="none" stroke="#604D53" stroke-width="25" stroke-linecap="round"/>
        <path d="M148 152 Q160 122 135 105" fill="none" stroke="#9DA3A4" stroke-width="19" stroke-linecap="round"/>
        <circle cx="135" cy="105" r="9" fill="#D5C5C8"/>
      </g>
    </svg>
    <h1>Привет, мисс Кисс! Выбери, как ты хочешь провести выходной день</h1>
    <p class="lead"><b>Нажми на любую карточку</b>, чтобы открыть место, и выбери то, что понравится больше всего.</p>
    <button class="btn" id="start" type="button">Посмотреть</button>
  </section>

  <section class="slide" id="s2" aria-label="Карточки с местами">
    <h2>Выбери одну карточку</h2>
    <div class="cards" id="cards"></div>
    <button class="back" id="back" type="button">← Вернуться к началу</button>
  </section>

  <section class="slide" id="s3" aria-label="Твой выбор">
    <canvas id="fx" aria-hidden="true"></canvas>
    <h2>Отличный выбор!</h2>
    <div class="pick" id="pick"></div>
    <p class="pick-info" id="pick-info"></p>
    <button class="back" id="again" type="button">← Выбрать другое место</button>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-in">
    <div class="grab"></div>
    <h3 id="sheet-title"></h3>
    <p id="sheet-text"></p>
    <div class="sheet-actions">
      <button class="btn" id="sheet-pick" type="button">Выбрать</button>
      <button class="btn btn-ghost" id="sheet-close" type="button">Закрыть</button>
    </div>
  </div>
</aside>

<script>
/* ===== Здесь меняются названия и картинки мест =====
   name  — название места
   image — картинка (адрес файла или data:-ссылка). Пока null, показывается цветная заглушка. */
const PLACES = [
  { name: "Парк Александрия", image: "img/aleksandriya.jpg", details: 'Место: Петергоф г., Петродворцовый район<br>Время: с 14:00 до 18:00<br>Дресскод: удобная и теплая одежда для прогулок' },
  { name: "Пицца и вино дома", image: "img/pizza-vino.jpg", details: 'Место: Дом<br>Время: 20:00<br>Дресскод: домашняя одежда' },
  { name: "Mama Roma", image: "img/mama-roma.jpg", details: 'Место: <a href="https://2gis.ru/spb/geo/5348660212664271" target="_blank" rel="noopener">Средний проспект В.О., 6</a><br>Время: 19:00<br>Дресскод: теплая и уютная одежда' }
];

const deck = document.getElementById('deck');
const wrap = document.getElementById('cards');

PLACES.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'card';
  btn.setAttribute('aria-pressed', 'false');
  btn.setAttribute('aria-label', 'Карточка ' + (i + 1) + ', нажми, чтобы перевернуть');
  const photo = p.image
    ? '<div class="photo" style="background-image:url(\'' + p.image + '\')" role="img" aria-label="' + p.name + '"></div>'
    : '<div class="photo ph ph' + (i + 1) + '">Здесь будет фото</div>';
  btn.innerHTML =
    '<div class="inner">' +
      '<div class="face back-face"><div class="mark">?</div></div>' +
      '<div class="face front-face">' + photo + '<div class="name"></div></div>' +
    '</div>';
  btn.querySelector('.name').textContent = p.name;
  btn.addEventListener('click', () => {
    if (!btn.classList.contains('flipped')) {
      btn.classList.add('flipped');
      btn.setAttribute('aria-pressed', 'true');
      btn.setAttribute('aria-label', p.name + ', нажми, чтобы узнать подробнее');
    } else {
      openSheet(p, btn, i);
    }
  });
  wrap.appendChild(btn);
});

const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
let lastCard = null;
let current = null;
function openSheet(p, card, i) {
  lastCard = card;
  current = { p, i };
  document.getElementById('sheet-title').textContent = p.name;
  document.getElementById('sheet-text').innerHTML = p.details || '';
  sheet.classList.add('open');
  scrim.classList.add('open');
  document.getElementById('sheet-pick').focus({ preventScroll: true });
}
function closeSheet() {
  sheet.classList.remove('open');
  scrim.classList.remove('open');
  if (lastCard) { lastCard.focus({ preventScroll: true }); lastCard = null; }
}
/* ===== Третий слайд: выбранная карточка и салют ===== */
function photoHtml(p, i) {
  return p.image
    ? `<div class="photo" style="background-image:url('${p.image}')" role="img" aria-label="${p.name}"></div>`
    : `<div class="photo ph ph${i + 1}">Здесь будет фото</div>`;
}

const fx = document.getElementById('fx');
const fctx = fx.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rockets = [], sparks = [], fxOn = false, fxTimer = null, fxRaf = 0, W = 0, H = 0, dpr = 1;

function fxResize() {
  const s = fx.parentElement;
  W = s.clientWidth; H = s.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  fx.width = W * dpr; fx.height = H * dpr;
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function fxColors() {
  const cs = getComputedStyle(document.documentElement);
  return [cs.getPropertyValue('--accent').trim(), cs.getPropertyValue('--fg').trim(), '#9DA3A4'];
}
function launch() {
  if (rockets.length > 10) return;
  rockets.push({ x: W * (0.12 + Math.random() * 0.76), y: H, ty: H * (0.1 + Math.random() * 0.35), vy: -(H * 0.014 + Math.random() * 3) });
}
function explode(x, y) {
  const cols = fxColors();
  const main = cols[Math.floor(Math.random() * cols.length)];
  const k = Math.max(0.6, Math.min(W, H) / 700);
  const n = 70;
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.2;
    const sp = (1.5 + Math.random() * 4.2) * k;
    sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.009 + Math.random() * 0.012, color: Math.random() < 0.2 ? cols[0] : main });
  }
}
function fxFrame() {
  if (!fxOn) return;
  fctx.clearRect(0, 0, W, H);
  fctx.lineCap = 'round';
  const accent = fxColors()[0];
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    fctx.globalAlpha = 1; fctx.strokeStyle = accent; fctx.lineWidth = 3;
    fctx.beginPath(); fctx.moveTo(r.x, r.y); fctx.lineTo(r.x, r.y - vyLen(r)); fctx.stroke();
    r.y += r.vy; r.vy *= 0.985;
    if (r.y <= r.ty || Math.abs(r.vy) < 1.2) { explode(r.x, r.y); rockets.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.px = s.x; s.py = s.y;
    s.vx *= 0.985; s.vy = s.vy * 0.985 + 0.05;
    s.x += s.vx; s.y += s.vy; s.life -= s.decay;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    fctx.globalAlpha = Math.max(s.life, 0);
    fctx.strokeStyle = s.color; fctx.lineWidth = 2.2;
    fctx.beginPath(); fctx.moveTo(s.px, s.py); fctx.lineTo(s.x, s.y); fctx.stroke();
  }
  fctx.globalAlpha = 1;
  fxRaf = requestAnimationFrame(fxFrame);
}
function vyLen(r) { return Math.min(26, Math.abs(r.vy) * 2.2); }
function startFx() {
  if (reduceMotion || fxOn) return;
  fxResize();
  fxOn = true; rockets = []; sparks = [];
  setTimeout(launch, 650); setTimeout(launch, 950); setTimeout(launch, 1250);
  fxTimer = setInterval(() => { launch(); if (Math.random() < 0.45) setTimeout(launch, 220); }, 950);
  fxRaf = requestAnimationFrame(fxFrame);
}
function stopFx() {
  fxOn = false;
  clearInterval(fxTimer); cancelAnimationFrame(fxRaf);
  rockets = []; sparks = [];
  fctx.clearRect(0, 0, W, H);
}
window.addEventListener('resize', () => { if (fxOn) fxResize(); });

document.getElementById('sheet-pick').addEventListener('click', () => {
  if (!current) return;
  const { p, i } = current;
  document.getElementById('pick').innerHTML = photoHtml(p, i) + '<div class="name"></div>';
  document.querySelector('#pick .name').textContent = p.name;
  document.getElementById('pick-info').innerHTML = p.details || '';
  lastCard = null;
  closeSheet();
  deck.classList.add('on-3');
  stopFx();
  startFx();
  setTimeout(() => document.getElementById('again').focus({ preventScroll: true }), 700);
});
document.getElementById('again').addEventListener('click', () => {
  deck.classList.remove('on-3');
  stopFx();
});

scrim.addEventListener('click', closeSheet);
document.getElementById('sheet-close').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

document.getElementById('start').addEventListener('click', () => deck.classList.add('on-2'));
document.getElementById('back').addEventListener('click', () => { closeSheet(); deck.classList.remove('on-2'); });
</script>
</body>
</html>
